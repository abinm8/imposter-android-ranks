name: Daily Android ranks
on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node track.mjs
      - name: Save results
        run: |
          git config user.name "rank-bot"
          git config user.email "rank-bot@users.noreply.github.com"
          git add android_ranks.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Android ranks $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
